name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定 Flutter 版本：别用 channel: stable。否则某天上游改了工程模板，
  # 你一行代码没动，CI 也会红。
  FLUTTER_VERSION: 3.47.9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 读取版本号（单一来源：pubspec.yaml）
        id: ver
        run: |
          V=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "本次版本：$V"

      - name: 补全安卓工程文件（如果缺失）
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name video_scraper .
          fi

      # 兜底：flutter create 在补全 android/ 时，若 test/widget_test.dart 不存在，
      # 会生成模板的计数器示例（引用不存在的 MyApp），让下一步 analyze 直接 error。
      # 仓库里已有自己的 test/widget_test.dart，正常情况下这里什么都不会删。
      - name: 移除模板生成的示例测试
        run: |
          if grep -qs "Counter increments smoke test" test/widget_test.dart; then
            rm -f test/widget_test.dart
            echo "已删除模板生成的 test/widget_test.dart"
          fi

      - name: 添加安卓权限（联网 + 读写存储）
        run: |
          python3 - <<'EOF'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          s = open(path, encoding='utf-8').read()
          if 'MANAGE_EXTERNAL_STORAGE' not in s:
              perms = (
                  '<uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n'
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n'
                  '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n'
                  '    '
              )
              s = s.replace('<application', perms + '<application', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="影片刮削器"', s, count=1)
          open(path, 'w', encoding='utf-8').write(s)
          EOF

      - name: 使用固定签名（便于覆盖安装）
        run: |
          if [ -f ci/debug.keystore ]; then
            mkdir -p ~/.android
            cp ci/debug.keystore ~/.android/debug.keystore
            echo "已使用固定签名 ci/debug.keystore"
          else
            echo "::warning::没有找到 ci/debug.keystore，本次使用临时签名，新版可能无法覆盖安装旧版"
          fi

      - name: 添加屏幕常亮功能（安卓原生代码）
        run: |
          python3 - <<'EOF'
          import glob, re, sys
          files = glob.glob('android/app/src/main/**/MainActivity.kt', recursive=True)
          if not files:
              print('::warning::没找到 MainActivity.kt，跳过屏幕常亮补丁')
              sys.exit(0)
          f = files[0]
          src = open(f, encoding='utf-8').read()
          pkg = re.search(r'^package\s+([\w.]+)', src, re.M).group(1)
          code = '''package PKG

          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "app/keepawake")
                      .setMethodCallHandler { call, result ->
                          runOnUiThread {
                              if (call.method == "enable") {
                                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                              } else {
                                  window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                              }
                              result.success(null)
                          }
                      }
              }
          }
          '''
          open(f, 'w', encoding='utf-8').write(code.replace('PKG', pkg))
          print('已写入', f)
          EOF

      - name: 提高 compileSdk 到 37（permission_handler 需要）
        run: |
          f=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n1)
          echo "修改文件：$f"
          sed -i -E 's/compileSdk(Version)?[ =]+flutter\.compileSdkVersion/compileSdk = 37/' "$f"
          grep -n "compileSdk" "$f"
          echo "android.suppressUnsupportedCompileSdk=37" >> android/gradle.properties

      - name: 缓存 Gradle（减少下载，避免网络波动导致失败）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 安装依赖
        run: flutter pub get

      # window_manager 0.6 依赖 nativeapi → cnativeapi，后者带 native assets
      # 构建钩子：`flutter test` 会为宿主平台（Linux）编译一段 C++，构建脚本用
      # pkg-config 探测 GTK3 / X11 / Xi。ubuntu-latest 只有运行时库、没有 -dev
      # 头文件，于是测试阶段报 "Package 'gtk+-3.0' not found"。
      # 注意 flutter analyze 不做原生编译，所以它是绿的，问题只暴露在 test。
      - name: 安装原生依赖（GTK3 / X11 / Xi）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgtk-3-dev libx11-dev libxi-dev pkg-config
          # 自检：这里必须打印出版本号，否则后面的测试一定会失败
          pkg-config --modversion gtk+-3.0 x11 xi

      # 只有 error 才让构建失败；info / warning 先放着，慢慢清。
      - name: 静态检查
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 单元测试
        run: flutter test

      # cnativeapi 的 Android 目标同样要编译原生代码。它找 NDK 只有两条路：
      # PATH 上有 ndk-build，或 NDK 位于 $HOME/Android/Sdk/ndk/ 下。
      # GitHub runner 的 SDK 在 /usr/local/lib/android/sdk，两条都不满足，
      # 所以把 runner 自带的 NDK 加进 PATH（ndk-build 就在 NDK 根目录）。
      - name: 让原生构建找到 Android NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -1)
          if [ -n "$NDK_DIR" ]; then
            echo "使用 NDK：$NDK_DIR"
            echo "$NDK_DIR" >> "$GITHUB_PATH"
          else
            echo "::warning::没有找到 NDK；若打包阶段报 NDK not found，需要手动安装"
          fi

      - name: 打包 APK（网络不稳定时自动重试）
        run: |
          for i in 1 2 3; do
            if flutter build apk --release --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}; then
              exit 0
            fi
            echo "::warning::第 $i 次打包失败，30 秒后重试"
            sleep 30
          done
          echo "::error::连续 3 次打包失败"
          exit 1

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ steps.ver.outputs.name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
