# 影片刮削器 —— 静态检查配置
#
# 目标：只开"能抓到真 bug"的规则，不去纠结缩进和引号，
# 免得第一次跑就被几百条风格提示劝退。
#
# 用法：
#   flutter analyze
#   dart fix --apply        # 自动修掉大部分 info

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # strict-casts 能抓出隐式 dynamic 转换（Cfg.load 那类问题的根源），
    # 但本项目大量直接索引 Map<String, dynamic>，打开后会先淹一批提示。
    # 等把配置/索引的读写都改成显式取值后，再把这里改成 true。
    strict-casts: false
    # 撤销记录是 JSON 往返的 Map<String, dynamic>，organizeInto / fixImages
    # 的参数暂时还用裸 List（改成强类型需要同时改 call site 的运行时 cast，
    # 收益不大风险不小）。等这块重构成 record 后再打开。
    strict-raw-types: false

  errors:
    unused_import: error
    unused_element: warning
    unused_local_variable: warning
    dead_code: warning
    unnecessary_null_comparison: warning

  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # —— 能直接抓到 bug 的 ——
    unawaited_futures: true # 漏掉 await（本项目有若干处 rescan/日志）
    use_build_context_synchronously: true # await 之后直接用 context
    only_throw_errors: true # 不要 throw '字符串'
    throw_in_finally: true
    cancel_subscriptions: true
    close_sinks: true
    avoid_print: true

    # —— 低噪音、值得保留下来的 ——
    prefer_const_declarations: true
    unnecessary_string_interpolations: true
    unnecessary_brace_in_string_interps: false
    avoid_empty_else: true
    avoid_slow_async_io: false # Windows 网络盘上 existsSync 反而更快
